<main class="main"> 

    <div class="login-container">
        <div class="login-left">
            <h2>Login! 👋</h2>
            <!-- <button class="btn btn-google">Sign in with Google</button>
            <button class="btn btn-apple">Sign in with Apple</button> -->

            <p>Enter your Employee Number</p>
            <!-- <label>Employee Number</label> -->
            <input 
                [(ngModel)]="userNumber" 
                id="user-number" 
                name="userNumber" 
                placeholder="005xxxxx" 
            />
            <button (click)="navigate()" class="btn btn-signin">Enter</button>
        </div>

        <div class="login-right">
          <div class="login-info">
            <h3>Why should I login?</h3>
            <p>By logging in, you can access your personal dashboard, where you can manage your account, view your profile, and much more.</p>
          </div>
        </div>
      </div>

</main>

<router-outlet />
